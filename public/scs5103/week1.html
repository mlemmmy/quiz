<script id="slides-data" type="application/json">[{"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 0, "bcount": 25, "btitle": "1. Definition", "html": "<p><b>Academic:</b> Pattern recognition is the scientific discipline concerned with the automatic discovery of regularities in data through algorithms, and the use of these regularities to take actions such as assigning the data to one of several categories.</p>\n<p><b>Plain English:</b> It's teaching a machine to notice a repeating shape, sound, or rule in data, and then use that noticing to make a decision — like sorting mail by handwritten zip code, or deciding a photo shows a cat and not a dog.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 1, "bcount": 25, "btitle": "2. Keywords", "html": "<div class=\"kw-grid\">\n<span class=\"kw\"><b>Pattern</b> — a regularity or structure in data</span>\n<span class=\"kw\"><b>Feature</b> — a measurable property used to describe a pattern</span>\n<span class=\"kw\"><b>Feature vector</b> — an ordered list of features for one item</span>\n<span class=\"kw\"><b>Class / category</b> — the group a pattern is assigned to</span>\n<span class=\"kw\"><b>Classifier</b> — the algorithm that assigns classes</span>\n<span class=\"kw\">Training data</span>\n<span class=\"kw\">Test data</span>\n<span class=\"kw\"><b>Supervised learning</b> — learns from labeled examples</span>\n<span class=\"kw\"><b>Unsupervised learning</b> — finds structure without labels</span>\n<span class=\"kw\"><b>Decision boundary</b> — the line/surface separating classes</span>\n<span class=\"kw\">Feature space</span>\n<span class=\"kw\"><b>Dimensionality</b> — number of features</span>\n<span class=\"kw\"><b>Generalization</b> — performing well on unseen data</span>\n<span class=\"kw\"><b>Overfitting</b> — memorizing training data instead of learning the rule</span>\n<span class=\"kw\">Noise</span>\n<span class=\"kw\">Ground truth</span>\n<span class=\"kw\">Preprocessing</span>\n</div>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 2, "bcount": 25, "btitle": "3. Core explanation", "html": "<p><b>What is it?</b> A field that sits between statistics, computer science, and signal processing, all aimed at one question: given raw measurements, which category do they belong to?</p>\n<p><b>What does it mean?</b> Real-world objects — a face, a signature, a tumor on a scan — rarely repeat identically. Pattern recognition assumes that despite variation, members of the same class share statistical regularities that can be measured and learned.</p>\n<p><b>Purpose:</b> to automate decisions that would otherwise need a human expert looking at each item one by one.</p>\n<p><b>Why it matters:</b> almost every modern \"smart\" system — unlocking a phone by face, a spam filter, a doctor's diagnostic aid — is a pattern recognition system underneath.</p>\n<p><b>Problem it solves:</b> humans are slow, inconsistent, and don't scale. A trained system can process millions of items with a repeatable, tunable decision rule.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 3, "bcount": 25, "btitle": "4. How it works", "html": "<ol>\n<li><b>Sensing:</b> a sensor captures raw data (camera, microphone, scanner).</li>\n<li><b>Preprocessing:</b> noise is reduced, signal is normalized.</li>\n<li><b>Feature extraction:</b> the raw data is turned into a compact, informative set of numbers.</li>\n<li><b>Classification:</b> a decision rule maps the feature vector to a class.</li>\n<li><b>Output:</b> the system reports a decision (and often a confidence score).</li>\n</ol>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 4, "bcount": 25, "btitle": "5. Diagram", "html": "<pre class=\"ascii\">Raw Object / Signal\n        │\n        ▼\n   Preprocessing\n        │\n        ▼\n Feature Extraction  ──►  Feature Vector [x1, x2, ..., xd]\n        │\n        ▼\n    Classification\n        │\n        ▼\n   Class / Decision</pre>\n<p>Each stage narrows raw, noisy input down to a single decision — the whole point is compression: from a huge signal to one label.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 5, "bcount": 25, "btitle": "6. Example", "html": "<p>A postal sorting machine photographs a handwritten zip code, extracts the shape of each digit, and classifies each one as 0–9 — no human reads it.</p>\n<p>A phone camera detects a face in the frame and recognizes whose face it is, comparing it against stored templates.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 6, "bcount": 25, "btitle": "7. Applications", "html": "<ul>\n<li><b>Biometrics:</b> fingerprint, face, and iris recognition for identity.</li>\n<li><b>Medicine:</b> classifying tumors as benign/malignant from scans.</li>\n<li><b>OCR:</b> reading printed or handwritten text.</li>\n<li><b>Speech:</b> recognizing spoken words or a speaker's identity.</li>\n<li><b>Industry:</b> detecting defective parts on a production line.</li>\n<li><b>Finance:</b> flagging fraudulent transactions.</li>\n</ul>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 7, "bcount": 25, "btitle": "8. Advantages", "html": "<ul>\n<li><b>Speed:</b> decisions in milliseconds at scale.</li>\n<li><b>Consistency:</b> the same input always gets the same treatment, unlike a tired human.</li>\n<li><b>Handles large data:</b> can sift through volumes no human team could review.</li>\n<li><b>Finds subtle regularities:</b> can pick up patterns too faint or high-dimensional for a person to notice.</li>\n</ul>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 8, "bcount": 25, "btitle": "9. Limitations", "html": "<ul>\n<li><b>Data-dependent:</b> poor or biased data produces poor or biased decisions.</li>\n<li><b>Sensitive to noise:</b> corrupted measurements can mislead the classifier.</li>\n<li><b>Generalization risk:</b> a system tuned too closely to training data can fail on new data (overfitting).</li>\n<li><b>Opacity:</b> some classifiers (e.g. neural networks) are hard to interpret.</li>\n</ul>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 9, "bcount": 25, "btitle": "10. Comparisons", "html": "<table class=\"cmp\">\n<tr><th></th><th>Pattern Recognition</th><th>Image Processing</th><th>Machine Learning</th></tr>\n<tr><td>Goal</td><td>Assign a category to input</td><td>Transform/enhance an image</td><td>Learn a function from data generally</td></tr>\n<tr><td>Output</td><td>A class label</td><td>A modified image</td><td>Predictions of any kind</td></tr>\n<tr><td>Relationship</td><td colspan=\"2\">Often uses image processing as its preprocessing step</td><td>Provides many of the algorithms pattern recognition uses</td></tr>\n</table>\n<p><b>Common confusion:</b> Pattern recognition is often treated as a synonym for machine learning — in reality, pattern recognition is the older, application-focused field (specifically about classification/description of patterns); machine learning is the broader set of learning algorithms it draws on.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 10, "bcount": 25, "btitle": "11. Mathematical / formula component", "html": "<p>A pattern is represented as a feature vector <b>x</b> = [x₁, x₂, …, x<sub>d</sub>], a point in a <i>d</i>-dimensional feature space. No further formal mathematics is needed yet — this notation is simply the language every later concept will build on.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 11, "bcount": 25, "btitle": "14. Lecture definition", "html": "<p><b>Pattern Recognition</b> is described in the lecture as a branch of machine learning focused on the recognition of patterns and regularities in data.</p><p>It is also described as the <b>automated recognition of patterns and regularities in data</b>.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 12, "bcount": 25, "btitle": "15. Areas of use", "html": "<ul><li>Statistical data analysis</li><li>Signal processing</li><li>Information retrieval</li><li>Bioinformatics</li><li>Data compression</li><li>Computer graphics</li><li>Machine learning</li></ul>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 13, "bcount": 25, "btitle": "16. Roots and examples", "html": "<p>The lecture notes say pattern recognition has roots in <b>statistics and engineering</b>, linked to increased availability of big data and processing power.</p><p>Examples given include <b>speech recognition</b> and <b>automatic medical diagnosis</b>.</p><p>Another description is the discovery of irregularities in data using computer algorithms, followed by actions such as data classification.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 14, "bcount": 25, "btitle": "17. Human recognition → machine task", "html": "<p>The lecture asks: how do humans recognise a face, read handwritten characters or understand words?</p><table class=\"cmp\"><tr><th>Task</th><th>Input</th><th>Output</th></tr><tr><td>Face recognition</td><td>Face</td><td>Name of the person</td></tr><tr><td>Medical diagnosis</td><td>Symptoms</td><td>Disease</td></tr></table><p>The machine takes an <b>input</b> and produces the desired <b>output</b>.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 15, "bcount": 25, "btitle": "18. Pattern recognition — another definition", "html": "<p>The lecture also defines pattern recognition as the act of taking in <b>raw data</b> and making an action based on the category of the pattern.</p><p>It is presented as a <b>branch/subdivision of machine learning</b> that emphasises recognition of data patterns.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 16, "bcount": 25, "btitle": "19. Three learning types", "html": "<div class=\"kw-grid\"><span class=\"kw\"><b>Supervised learning</b></span><span class=\"kw\"><b>Unsupervised learning</b></span><span class=\"kw\"><b>Semi-supervised learning</b></span></div><p class=\"anchor-box\"><b>LECTURE STRUCTURE</b>The notes introduce these three learning approaches as part of the pattern-recognition discussion.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 17, "bcount": 25, "btitle": "20. Supervised learning", "html": "<p><b>Classification</b></p><p>The lecture notes describe this as where the probability of the output is two values: <b>Yes / No</b>.</p><p><b>Regression</b></p><p>The notes describe the probability of the output as more than two values.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 18, "bcount": 25, "btitle": "21. Unsupervised learning", "html": "<p><b>Clustering:</b> grouping data into a large set depending on a particular behaviour, for example customer purchase behaviour.</p><p><b>Association:</b> discovery of relationships between variables in large databases. The lecture example is Amazon customers who buy product A tending to buy product Z as well.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 19, "bcount": 25, "btitle": "22. Semi-supervised learning", "html": "<p>Semi-supervised learning is described as a situation where there are <b>large amounts of data</b>, but the output can only be found for <b>some of the data</b>.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 20, "bcount": 25, "btitle": "23. Machine learning", "html": "<p>The lecture describes machine learning as <b>how computers recognise patterns</b>.</p><ul><li>There is no step-by-step programming; trial and error is used.</li><li>ML can take images, videos, audio and text.</li><li>A machine learns to recognise data and then makes predictions.</li><li>ML derives meaning from data and uses data to answer questions.</li></ul>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 21, "bcount": 25, "btitle": "24. Machine Learning vs Deep Learning", "html": "<table class=\"cmp\"><tr><th>ML</th><th>DL</th></tr><tr><td>Requires a small dataset according to the notes</td><td>Requires a large dataset</td></tr><tr><td>Training time is shorter</td><td>Training time is longer</td></tr><tr><td>More classifiers are available</td><td>Requires high-performance computing</td></tr></table><p>The notes also mention <b>Google Collaboratory</b> as a question to investigate for overcoming the computing requirements.</p>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 22, "bcount": 25, "btitle": "25. Machine learning steps", "html": "<ol><li><b>Understand and identify the business problem</b></li><li><b>Understand and identify the data</b></li><li><b>Collect and prepare data</b> — data collection, cleaning, aggregating, labelling, transformation</li><li><b>Determine the model features and train the model</b> — technique selection, training, hyper-parameter settling, validation, development/testing, algorithm selection, optimisation</li><li><b>Evaluate model performance</b> — metrics, confusion matrix calculations, KPIs, quality measurements, final determination</li><li><b>Experiment and adjust the model in operation</b> — use a control group and evaluate real-world performance</li><li><b>Repeat and improve</b> — the notes emphasise trial and error and continuous improvement.</li></ol>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 23, "bcount": 25, "btitle": "Recap", "html": "<div class=\"anchor-box\"><b>MEMORY ANCHOR</b>\"Measure it, describe it, decide it.\" Every pattern recognition system does exactly those three things, in that order.</div><div class=\"must-remember\">\n<b>MUST REMEMBER</b>\n<ol>\n<li>Pattern recognition = automatically discovering regularities in data and using them to classify.</li>\n<li>Pipeline: sensing → preprocessing → feature extraction → classification → decision.</li>\n<li>A feature vector is the numeric description of one pattern.</li>\n<li>It underlies biometrics, medical diagnosis, OCR, speech recognition, and fraud detection.</li>\n<li>Machine learning supplies the algorithms; pattern recognition is the applied discipline that uses them for classification/description.</li>\n</ol>\n</div>"}, {"cid": "c1", "cindex": 0, "cnum": "01", "ctitle": "Pattern Recognition", "cbuilds": "The umbrella discipline — everything else this week is a piece inside it.", "bindex": 24, "bcount": 25, "btitle": "Flashcards", "html": "<div class=\"flashcards\">\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What is pattern recognition, in one sentence?</div><div class=\"a\">A: The automatic discovery of regularities in data, used to assign data to categories.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Name the five stages of a basic pattern recognition pipeline.</div><div class=\"a\">A: Sensing, preprocessing, feature extraction, classification, decision/output.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What is a feature vector?</div><div class=\"a\">A: An ordered numeric list [x1,...,xd] describing one pattern's measurable properties.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What is overfitting?</div><div class=\"a\">A: When a classifier fits the training data too closely and fails to generalize to new data.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Give two real-world applications of pattern recognition.</div><div class=\"a\">A: Any two of: biometrics, OCR, medical diagnosis, speech recognition, fraud detection, defect inspection.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: How does pattern recognition differ from image processing?</div><div class=\"a\">A: Image processing transforms/enhances images; pattern recognition assigns a class label — image processing is often just a preprocessing step for it.</div></div>\n</div>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 0, "bcount": 13, "btitle": "1. Definition", "html": "<p><b>Academic:</b> A measured pattern is the set of quantitative or qualitative measurements taken from a real-world object or phenomenon through sensing and transduction, forming the raw input to a pattern recognition system.</p>\n<p><b>Plain English:</b> It's the actual numbers you get by measuring something — a fingerprint's ridge spacing, a photo's pixel brightness values, a patient's temperature — before any pattern-finding has happened.</p>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 1, "bcount": 13, "btitle": "2. Keywords", "html": "<div class=\"kw-grid\">\n<span class=\"kw\">Measurement</span><span class=\"kw\">Sensor</span><span class=\"kw\">Transducer</span>\n<span class=\"kw\">Raw data / signal</span><span class=\"kw\">Attribute / variable</span>\n<span class=\"kw\"><b>Nominal scale</b> — labels, no order (e.g. blood type)</span>\n<span class=\"kw\"><b>Ordinal scale</b> — ordered categories (e.g. mild/moderate/severe)</span>\n<span class=\"kw\"><b>Interval scale</b> — ordered, equal spacing, no true zero</span>\n<span class=\"kw\"><b>Ratio scale</b> — ordered, equal spacing, true zero</span>\n<span class=\"kw\">Continuous variable</span><span class=\"kw\">Discrete variable</span>\n<span class=\"kw\">Sampling</span><span class=\"kw\">Resolution</span><span class=\"kw\">Calibration</span>\n<span class=\"kw\">Digitization</span><span class=\"kw\">Noise</span>\n</div>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 2, "bcount": 13, "btitle": "3. Core explanation", "html": "<p><b>What is it?</b> The measurement stage is where the physical world gets converted into numbers a computer can process.</p>\n<p><b>What does it mean?</b> Every pattern recognition system starts from something physical — light, sound, pressure, temperature — that a sensor converts into a signal.</p>\n<p><b>Purpose:</b> to give the system a faithful, numeric description it can compare across many examples.</p>\n<p><b>Why it matters:</b> the whole system is only as good as its measurements — poor sensors or poor calibration put a ceiling on accuracy no algorithm can fix later.</p>\n<p><b>Problem it solves:</b> raw physical phenomena aren't directly computable; measurement bridges the physical world and the digital pipeline.</p>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 3, "bcount": 13, "btitle": "4. How it works", "html": "<ol>\n<li><b>Phenomenon:</b> the real-world object or event (e.g. a finger touching a scanner).</li>\n<li><b>Transduction:</b> a sensor converts a physical quantity into an electrical signal.</li>\n<li><b>Sampling/digitization:</b> the continuous signal is sampled at discrete points and converted to digital values.</li>\n<li><b>Measurement vector:</b> the digitized readings are organized into a structured record.</li>\n</ol>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 4, "bcount": 13, "btitle": "5. Diagram", "html": "<pre class=\"ascii\">Physical Phenomenon (light, sound, pressure...)\n        │\n        ▼\n    Sensor / Transducer\n        │\n        ▼\n   Analog Signal\n        │\n        ▼\n Sampling + Digitization\n        │\n        ▼\n  Measured Pattern  [reading1, reading2, ...]</pre>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 5, "bcount": 13, "btitle": "6. Example", "html": "<p>A fingerprint scanner measures ridge positions and pressure at thousands of points on a finger. A digital camera measures light intensity at every pixel. A hospital monitor measures heart rate, blood pressure, and oxygen saturation.</p>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 6, "bcount": 13, "btitle": "7. Applications", "html": "<ul>\n<li><b>Medical devices:</b> vitals monitoring feeding diagnostic systems.</li>\n<li><b>Biometric scanners:</b> capturing fingerprint, iris, or voice signals.</li>\n<li><b>Remote sensing:</b> satellites measuring reflected light for land classification.</li>\n<li><b>Industrial sensors:</b> measuring vibration or temperature to detect faults.</li>\n</ul>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 7, "bcount": 13, "btitle": "8. Advantages", "html": "<ul>\n<li><b>Objectivity:</b> numeric measurement removes subjective judgment.</li>\n<li><b>Reproducibility:</b> the same phenomenon can be re-measured and compared over time.</li>\n<li><b>Foundation for automation:</b> once digitized, data can be processed at any scale.</li>\n</ul>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 8, "bcount": 13, "btitle": "9. Limitations", "html": "<ul>\n<li><b>Sensor noise:</b> imperfect sensors introduce error.</li>\n<li><b>Calibration drift:</b> sensors can lose accuracy over time.</li>\n<li><b>Limited resolution:</b> some measurements can't capture fine detail.</li>\n<li><b>Cost:</b> precise sensing equipment can be expensive.</li>\n</ul>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 9, "bcount": 13, "btitle": "10. Comparisons", "html": "<table class=\"cmp\">\n<tr><th></th><th>Measured Pattern (raw)</th><th>Feature</th></tr>\n<tr><td>Stage</td><td>Straight from the sensor</td><td>After processing/selection</td></tr>\n<tr><td>Volume</td><td>Often large, redundant</td><td>Compact, informative</td></tr>\n<tr><td>Example</td><td>Every pixel value in an image</td><td>Edge count, average intensity</td></tr>\n</table>\n<p><b>Common confusion:</b> students often use \"measurement\" and \"feature\" interchangeably. A measurement is raw; a feature is a deliberately chosen or computed property that is useful for distinguishing classes.</p>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 10, "bcount": 13, "btitle": "11. Mathematical / formula component", "html": "<p>A measured pattern is represented as a vector of raw readings: <b>x</b> = [x₁, x₂, …, x<sub>n</sub>], where each x<sub>i</sub> is one sensor reading. Example: a blood pressure reading might be x = [120, 80] (systolic, diastolic) — two raw measurements, no interpretation yet.</p>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 11, "bcount": 13, "btitle": "Recap", "html": "<div class=\"anchor-box\"><b>MEMORY ANCHOR</b>\"Measurement is the world becoming numbers.\" Nothing else in the pipeline can happen until this step exists.</div><div class=\"must-remember\">\n<b>MUST REMEMBER</b>\n<ol>\n<li>A measured pattern is raw, sensor-derived data — before feature extraction.</li>\n<li>Sensors/transducers convert physical phenomena into signals; sampling digitizes them.</li>\n<li>Measurement scales: nominal, ordinal, interval, ratio.</li>\n<li>Measurement quality (noise, calibration, resolution) puts a ceiling on system accuracy.</li>\n<li>Measured pattern ≠ feature: features are derived from measurements.</li>\n</ol>\n</div>"}, {"cid": "c2", "cindex": 1, "cnum": "02", "ctitle": "Measured Patterns", "cbuilds": "Builds onPattern Recognition— before you can classify anything, you need actual measurements to work with.", "bindex": 12, "bcount": 13, "btitle": "Flashcards", "html": "<div class=\"flashcards\">\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What is a measured pattern?</div><div class=\"a\">A: The raw quantitative/qualitative measurements taken from an object via sensing, before further processing.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Name the four measurement scales.</div><div class=\"a\">A: Nominal, ordinal, interval, ratio.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What role does a transducer play?</div><div class=\"a\">A: Converts a physical quantity (light, pressure, sound) into an electrical signal.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: How does a measurement differ from a feature?</div><div class=\"a\">A: A measurement is raw sensor output; a feature is a derived, informative property computed from measurements.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Why does sensor calibration matter?</div><div class=\"a\">A: Poor calibration introduces systematic error that limits the accuracy of everything downstream.</div></div>\n</div>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 0, "bcount": 13, "btitle": "1. Definition", "html": "<p><b>Academic:</b> A class (or category) is a set of patterns that share common statistical or structural characteristics, defined so that a classification system can assign new patterns to it based on a decision rule.</p>\n<p><b>Plain English:</b> A class is a labeled bucket — \"cat,\" \"dog,\" \"spam,\" \"benign tumor\" — that things get sorted into once you know their measurements.</p>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 1, "bcount": 13, "btitle": "2. Keywords", "html": "<div class=\"kw-grid\">\n<span class=\"kw\">Class / category</span><span class=\"kw\">Label</span><span class=\"kw\">Class boundary</span>\n<span class=\"kw\"><b>Within-class variability</b> — differences among members of the same class</span>\n<span class=\"kw\"><b>Between-class variability</b> — differences that separate classes</span>\n<span class=\"kw\">Binary (two-class)</span><span class=\"kw\">Multi-class</span>\n<span class=\"kw\"><b>Prior probability</b> — how likely a class is before seeing any data</span>\n<span class=\"kw\"><b>Class-conditional density</b> — distribution of features given a class</span>\n<span class=\"kw\">Discriminant function</span><span class=\"kw\">Ground truth label</span>\n<span class=\"kw\">Class imbalance</span><span class=\"kw\">Cluster (unsupervised analog)</span>\n</div>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 2, "bcount": 13, "btitle": "3. Core explanation", "html": "<p><b>What is it?</b> The set of possible answers a classifier can give.</p>\n<p><b>What does it mean?</b> Defining classes is a design decision — a system must be told in advance what categories exist (in supervised settings) before it can learn to tell them apart.</p>\n<p><b>Purpose:</b> to give structure to the problem; without defined classes, \"classification\" has no target.</p>\n<p><b>Why it matters:</b> the quality of class definitions directly affects how learnable the problem is — poorly defined, overlapping classes make even a perfect algorithm struggle.</p>\n<p><b>Problem it solves:</b> converts an open-ended recognition problem into a closed decision among a known set of outcomes.</p>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 3, "bcount": 13, "btitle": "4. How it works", "html": "<ol>\n<li><b>Define classes:</b> decide, from domain knowledge, what categories exist (e.g. digits 0–9).</li>\n<li><b>Collect labeled examples:</b> gather patterns whose true class is known.</li>\n<li><b>Characterize each class:</b> examine how its feature values are distributed.</li>\n<li><b>Locate class regions:</b> in feature space, each class ideally occupies its own region.</li>\n</ol>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 4, "bcount": 13, "btitle": "5. Diagram", "html": "<pre class=\"ascii\">Feature 2\n   │        o o\n   │      o  o  o     Class A (o)\n   │        o o\n   │\n   │                x x\n   │              x  x  x   Class B (x)\n   │                x x\n   └──────────────────────── Feature 1</pre>\n<p>Each class occupies a region of feature space. Classification later works by figuring out which region a new point falls into.</p>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 5, "bcount": 13, "btitle": "6. Example", "html": "<p>In handwritten digit recognition, the classes are \"0\" through \"9.\" In medical diagnosis, the classes might be \"benign\" and \"malignant.\" In animal recognition, classes could be \"cat,\" \"dog,\" \"bird.\"</p>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 6, "bcount": 13, "btitle": "7. Applications", "html": "<ul>\n<li><b>Spam filtering:</b> classes are \"spam\" and \"not spam.\"</li>\n<li><b>Medical screening:</b> classes such as disease-present / disease-absent.</li>\n<li><b>Species identification:</b> classes correspond to species.</li>\n<li><b>Biometric identification:</b> each enrolled person is effectively their own class.</li>\n</ul>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 7, "bcount": 13, "btitle": "8. Advantages", "html": "<ul>\n<li><b>Clarity of goal:</b> well-defined classes give the whole system a clear target.</li>\n<li><b>Enables evaluation:</b> known classes let you measure accuracy against ground truth.</li>\n<li><b>Domain alignment:</b> classes can be chosen to match real decisions people need (e.g. treat/don't treat).</li>\n</ul>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 8, "bcount": 13, "btitle": "9. Limitations", "html": "<ul>\n<li><b>Overlapping classes:</b> real classes often share feature space, causing ambiguous cases.</li>\n<li><b>Class imbalance:</b> some classes may have far fewer examples, biasing the classifier.</li>\n<li><b>Subjectivity in definition:</b> where to draw class boundaries isn't always obvious (e.g. \"mild\" vs \"moderate\" disease).</li>\n</ul>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 9, "bcount": 13, "btitle": "10. Comparisons", "html": "<table class=\"cmp\">\n<tr><th></th><th>Class</th><th>Cluster</th></tr>\n<tr><td>Origin</td><td>Predefined by a human/domain expert</td><td>Discovered automatically from data</td></tr>\n<tr><td>Learning type</td><td>Supervised</td><td>Unsupervised</td></tr>\n<tr><td>Label available?</td><td>Yes, during training</td><td>No — labels are not given</td></tr>\n</table>\n<p><b>Common confusion:</b> \"class\" and \"cluster\" are often used loosely as synonyms; a class is known and labeled in advance, a cluster is a group the algorithm finds on its own.</p>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 10, "bcount": 13, "btitle": "11. Mathematical / formula component", "html": "<p>Each class ω<sub>i</sub> has a <b>prior probability</b> P(ω<sub>i</sub>) — how common that class is overall. Example: if 1 in 100 scans shows a tumor, P(malignant) = 0.01 and P(benign) = 0.99. This single number becomes important later when weighing decisions under uncertainty.</p>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 11, "bcount": 13, "btitle": "Recap", "html": "<div class=\"anchor-box\"><b>MEMORY ANCHOR</b>\"A class is a bucket someone already labeled; a cluster is a bucket the machine found by itself.\"</div><div class=\"must-remember\">\n<b>MUST REMEMBER</b>\n<ol>\n<li>A class is a predefined category patterns can be assigned to.</li>\n<li>Classes ideally occupy distinct regions of feature space.</li>\n<li>Within-class variability vs between-class variability determines how separable classes are.</li>\n<li>Prior probability P(ω<sub>i</sub>) reflects how common a class is.</li>\n<li>Classes (supervised, labeled) differ from clusters (unsupervised, discovered).</li>\n</ol>\n</div>"}, {"cid": "c3", "cindex": 2, "cnum": "03", "ctitle": "Classes", "cbuilds": "Builds onMeasured Patterns— once you can measure a pattern, you need buckets to sort it into.", "bindex": 12, "bcount": 13, "btitle": "Flashcards", "html": "<div class=\"flashcards\">\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Define a class in pattern recognition.</div><div class=\"a\">A: A predefined category of patterns sharing common characteristics, used as a target label.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What is the difference between within-class and between-class variability?</div><div class=\"a\">A: Within-class = differences among members of one class; between-class = differences that separate classes from each other.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What is a prior probability?</div><div class=\"a\">A: The probability of a class occurring before any measurement is considered, P(ωi).</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: How does class imbalance cause problems?</div><div class=\"a\">A: It biases classifiers toward the majority class since there is far less evidence for the minority class.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Class vs cluster — what's the key difference?</div><div class=\"a\">A: A class is predefined and labeled (supervised); a cluster is discovered automatically without labels (unsupervised).</div></div>\n</div>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 0, "bcount": 13, "btitle": "1. Definition", "html": "<p><b>Academic:</b> Classification is the process of assigning a pattern, represented by its feature vector, to one of several predefined classes based on a decision rule learned or derived from data.</p>\n<p><b>Plain English:</b> It's deciding which labeled bucket a new item belongs to, based on its measured features.</p>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 1, "bcount": 13, "btitle": "2. Keywords", "html": "<div class=\"kw-grid\">\n<span class=\"kw\">Classifier</span><span class=\"kw\">Decision rule</span><span class=\"kw\">Decision boundary</span>\n<span class=\"kw\">Discriminant function</span><span class=\"kw\">Supervised learning</span>\n<span class=\"kw\">Training set</span><span class=\"kw\">Test set</span><span class=\"kw\">Feature space</span>\n<span class=\"kw\"><b>Linear classifier</b> — separates classes with a straight line/plane</span>\n<span class=\"kw\"><b>Nonlinear classifier</b> — separates classes with a curved boundary</span>\n<span class=\"kw\">Bayes classifier</span><span class=\"kw\">Nearest neighbor</span>\n<span class=\"kw\">Decision tree</span><span class=\"kw\">Confusion matrix</span>\n<span class=\"kw\">Accuracy / error rate</span><span class=\"kw\">Generalization</span>\n</div>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 2, "bcount": 13, "btitle": "3. Core explanation", "html": "<p><b>What is it?</b> The decision-making core of a pattern recognition system.</p>\n<p><b>What does it mean?</b> A classifier is a function that takes a feature vector as input and outputs a class label.</p>\n<p><b>Purpose:</b> to automate the \"which bucket does this belong in\" decision, consistently and at scale.</p>\n<p><b>Why it matters:</b> this is the step that actually produces the useful output — everything before it (measuring, extracting features) exists to make this step possible.</p>\n<p><b>Problem it solves:</b> lets a system make a repeatable decision under uncertainty, rather than requiring exact matches to known examples.</p>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 3, "bcount": 13, "btitle": "4. How it works", "html": "<ol>\n<li><b>Training:</b> the classifier learns a decision rule from labeled feature vectors.</li>\n<li><b>Decision boundary formation:</b> the rule effectively draws a boundary separating classes in feature space.</li>\n<li><b>Inference:</b> a new, unlabeled feature vector is compared against the learned rule.</li>\n<li><b>Output:</b> the class on whichever side of the boundary the new point falls is returned as the decision.</li>\n</ol>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 4, "bcount": 13, "btitle": "5. Diagram", "html": "<pre class=\"ascii\">Feature 2\n   │      o o\n   │    o  o  o   │\n   │      o o     │  ← decision boundary\n   │               │\n   │               │   x x\n   │               │ x  x  x\n   │               │   x x\n   └──────────────────────────── Feature 1\n\n  New point ●  → falls left of boundary → classified as \"o\"</pre>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 5, "bcount": 13, "btitle": "6. Example", "html": "<p>A handwriting recognizer takes the stroke shape of a digit and classifies it as \"7\" rather than \"1.\" A medical classifier takes a tumor's size, shape, and texture and classifies it as \"benign\" or \"malignant.\"</p>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 6, "bcount": 13, "btitle": "7. Applications", "html": "<ul>\n<li><b>Email filtering:</b> classifying messages as spam or not.</li>\n<li><b>Diagnostics:</b> classifying scans or lab results as normal/abnormal.</li>\n<li><b>Speech:</b> classifying audio segments as specific words.</li>\n<li><b>Quality control:</b> classifying manufactured parts as pass/fail.</li>\n</ul>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 7, "bcount": 13, "btitle": "8. Advantages", "html": "<ul>\n<li><b>Automates expert judgment:</b> replicates decisions a human expert would make, at scale.</li>\n<li><b>Quantifiable performance:</b> accuracy, error rate, and confusion matrices let you measure and improve it.</li>\n<li><b>Adaptable:</b> retraining on new data lets the classifier improve over time.</li>\n</ul>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 8, "bcount": 13, "btitle": "9. Limitations", "html": "<ul>\n<li><b>Boundary errors:</b> points near the decision boundary are prone to misclassification.</li>\n<li><b>Depends on feature quality:</b> a classifier can't separate classes on features that don't actually differ between them.</li>\n<li><b>Overfitting risk:</b> an overly complex boundary may fit training noise rather than the true pattern.</li>\n</ul>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 9, "bcount": 13, "btitle": "10. Comparisons", "html": "<table class=\"cmp\">\n<tr><th></th><th>Classification</th><th>Regression</th><th>Clustering</th></tr>\n<tr><td>Output</td><td>A discrete class label</td><td>A continuous number</td><td>Groupings (no predefined labels)</td></tr>\n<tr><td>Learning type</td><td>Supervised</td><td>Supervised</td><td>Unsupervised</td></tr>\n<tr><td>Example</td><td>Spam / not spam</td><td>Predicted house price</td><td>Customer segments</td></tr>\n</table>\n<p><b>Common confusion:</b> classification and regression are both \"supervised,\" but classification predicts a category, while regression predicts a numeric quantity.</p>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 10, "bcount": 13, "btitle": "11. Mathematical / formula component", "html": "<p>A simple decision rule using <b>discriminant functions</b>: for each class ω<sub>i</sub>, compute a score g<sub>i</sub>(x). Assign x to class ω<sub>i</sub> if g<sub>i</sub>(x) &gt; g<sub>j</sub>(x) for all other classes j.</p>\n<p><i>Meaning:</i> each class \"votes\" with a score based on the input's features; the class with the highest score wins. Example: if g₁(x) = 7.2 and g₂(x) = 3.5, the pattern is assigned to class 1.</p>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 11, "bcount": 13, "btitle": "Recap", "html": "<div class=\"anchor-box\"><b>MEMORY ANCHOR</b>\"Classification is the vote-counting step — every class scores the input, and the highest score wins.\"</div><div class=\"must-remember\">\n<b>MUST REMEMBER</b>\n<ol>\n<li>Classification assigns a feature vector to one predefined class using a decision rule.</li>\n<li>The classifier is trained on labeled data, then applied (\"inference\") to new data.</li>\n<li>A decision boundary is the geometric expression of the classifier's rule.</li>\n<li>Discriminant functions g<sub>i</sub>(x) let classes \"compete\" for the highest score.</li>\n<li>Classification (discrete output) differs from regression (continuous output).</li>\n</ol>\n</div>"}, {"cid": "c4", "cindex": 3, "cnum": "04", "ctitle": "Classification", "cbuilds": "Builds onClasses— now that buckets exist, this is the act of putting a pattern into the right one.", "bindex": 12, "bcount": 13, "btitle": "Flashcards", "html": "<div class=\"flashcards\">\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Define classification.</div><div class=\"a\">A: Assigning a feature vector to one of several predefined classes using a learned decision rule.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What is a decision boundary?</div><div class=\"a\">A: The surface in feature space that separates one class's region from another's.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What is a discriminant function?</div><div class=\"a\">A: A function gi(x) that scores how strongly a feature vector belongs to class i; the highest-scoring class is chosen.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Classification vs regression — key difference?</div><div class=\"a\">A: Classification outputs a discrete class label; regression outputs a continuous numeric value.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Why are points near the decision boundary risky?</div><div class=\"a\">A: They are close to being equally likely under either class, so small noise can flip the decision.</div></div>\n</div>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 0, "bcount": 13, "btitle": "1. Definition", "html": "<p><b>Academic:</b> The steps of classification are the sequential stages — from raw data acquisition through preprocessing, feature extraction, training, decision-making, and evaluation — that together constitute a complete pattern recognition system.</p>\n<p><b>Plain English:</b> It's the full recipe, start to finish, that turns a raw signal into a trustworthy class decision.</p>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 1, "bcount": 13, "btitle": "2. Keywords", "html": "<div class=\"kw-grid\">\n<span class=\"kw\">Data acquisition</span><span class=\"kw\">Preprocessing</span><span class=\"kw\">Segmentation</span>\n<span class=\"kw\">Feature extraction</span><span class=\"kw\">Feature selection</span>\n<span class=\"kw\">Dimensionality reduction</span><span class=\"kw\">Training phase</span>\n<span class=\"kw\">Model selection</span><span class=\"kw\">Testing phase</span><span class=\"kw\">Evaluation</span>\n<span class=\"kw\">Cross-validation</span><span class=\"kw\">Confusion matrix</span>\n<span class=\"kw\">Overfitting</span><span class=\"kw\">Underfitting</span><span class=\"kw\">Post-processing</span>\n</div>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 2, "bcount": 13, "btitle": "3. Core explanation", "html": "<p><b>What is it?</b> A structured pipeline, not a single algorithm — classification is the output of many coordinated stages.</p>\n<p><b>What does it mean?</b> Each stage transforms the data further, and errors introduced early (e.g. bad preprocessing) propagate through every later stage.</p>\n<p><b>Purpose:</b> to break an otherwise overwhelming problem (raw signal → decision) into manageable, testable steps.</p>\n<p><b>Why it matters:</b> understanding the pipeline lets you diagnose where a system is failing — is it the sensor, the features, or the classifier itself?</p>\n<p><b>Problem it solves:</b> provides a repeatable engineering process for building any pattern recognition system, regardless of domain.</p>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 3, "bcount": 13, "btitle": "4. How it works", "html": "<ol>\n<li><b>Data acquisition:</b> collect raw samples via sensors.</li>\n<li><b>Preprocessing:</b> remove noise, normalize scale, correct for missing values.</li>\n<li><b>Segmentation:</b> isolate the object of interest from background (e.g. separating a face from the rest of a photo).</li>\n<li><b>Feature extraction:</b> compute informative measurements from the segmented data.</li>\n<li><b>Feature selection / dimensionality reduction:</b> keep only the most useful features, discard redundant ones.</li>\n<li><b>Training:</b> fit a classifier on labeled examples (the training set).</li>\n<li><b>Testing / classification:</b> apply the trained classifier to new, unseen data.</li>\n<li><b>Evaluation:</b> measure accuracy/error using metrics like a confusion matrix; refine if needed.</li>\n</ol>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 4, "bcount": 13, "btitle": "5. Diagram", "html": "<pre class=\"ascii\">1 Data Acquisition\n      │\n2 Preprocessing\n      │\n3 Segmentation\n      │\n4 Feature Extraction\n      │\n5 Feature Selection / Dimensionality Reduction\n      │\n      ├──────────────┐\n      ▼              ▼\n6 Training      7 Testing (new data)\n  (labeled data)      │\n      └──────►  Classifier ──► Decision\n                       │\n                8 Evaluation (accuracy, confusion matrix)</pre>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 5, "bcount": 13, "btitle": "6. Example", "html": "<p>Fingerprint recognition end-to-end: (1) a scanner captures the finger image, (2) the image is cleaned of smudges and normalized, (3) the ridge pattern is segmented from the background, (4) minutiae points (ridge endings, bifurcations) are extracted as features, (5) the most distinctive minutiae are kept, (6) the system is trained on many enrolled fingerprints, (7) a new scan is compared against stored templates, (8) the match rate is evaluated to tune thresholds.</p>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 6, "bcount": 13, "btitle": "7. Applications", "html": "<ul>\n<li><b>Any deployed recognition system</b> — face ID, medical imaging AI, speech assistants — follows this same staged pipeline.</li>\n<li><b>Industrial inspection systems</b> use it to move from a camera image to a pass/fail decision.</li>\n<li><b>Document processing systems</b> use it to move from a scanned page to extracted, classified text.</li>\n</ul>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 7, "bcount": 13, "btitle": "8. Advantages", "html": "<ul>\n<li><b>Modularity:</b> each stage can be improved or swapped independently.</li>\n<li><b>Debuggability:</b> performance problems can be traced to a specific stage.</li>\n<li><b>Reusability:</b> the same pipeline structure applies across very different domains.</li>\n</ul>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 8, "bcount": 13, "btitle": "9. Limitations", "html": "<ul>\n<li><b>Error propagation:</b> a mistake in an early stage (e.g. bad segmentation) corrupts every later stage.</li>\n<li><b>Complexity:</b> more stages mean more places for something to go wrong and more to tune.</li>\n<li><b>Train/test mismatch:</b> if training data doesn't represent real-world conditions, testing performance can mislead.</li>\n</ul>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 9, "bcount": 13, "btitle": "10. Comparisons", "html": "<table class=\"cmp\">\n<tr><th></th><th>Training phase</th><th>Testing phase</th></tr>\n<tr><td>Data used</td><td>Labeled training set</td><td>Unseen test set</td></tr>\n<tr><td>Goal</td><td>Learn the decision rule</td><td>Evaluate/apply the decision rule</td></tr>\n<tr><td>Labels available?</td><td>Yes</td><td>Used only for scoring accuracy, not for the decision itself</td></tr>\n</table>\n<p><b>Common confusion:</b> students often conflate \"feature extraction\" with \"feature selection\" — extraction <i>computes</i> new measurements, selection <i>chooses</i> which of them to keep.</p>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 10, "bcount": 13, "btitle": "11. Mathematical / formula component", "html": "<p>Data is commonly split into a training set and a test set, e.g. 70%/30% or 80%/20%. This is not a rigid law — it is a practical convention to check generalization. No further formal mathematics is essential at this foundational stage.</p>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 11, "bcount": 13, "btitle": "Recap", "html": "<div class=\"anchor-box\"><b>MEMORY ANCHOR</b>\"Acquire → Clean → Isolate → Describe → Trim → Train → Test → Judge.\" Eight verbs, eight stages.</div><div class=\"must-remember\">\n<b>MUST REMEMBER</b>\n<ol>\n<li>The 8 stages: acquisition, preprocessing, segmentation, feature extraction, feature selection, training, testing, evaluation.</li>\n<li>Errors early in the pipeline propagate to every later stage.</li>\n<li>Training uses labeled data to learn the rule; testing applies it to unseen data.</li>\n<li>Feature extraction computes new measurements; feature selection chooses among them.</li>\n<li>Evaluation (e.g. confusion matrix) closes the loop and drives refinement.</li>\n</ol>\n</div>"}, {"cid": "c5", "cindex": 4, "cnum": "05", "ctitle": "Steps Associated with Classification", "cbuilds": "Builds onClassification— this zooms out from the decision itself to the full pipeline around it.", "bindex": 12, "bcount": 13, "btitle": "Flashcards", "html": "<div class=\"flashcards\">\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: List the eight steps of a classification pipeline in order.</div><div class=\"a\">A: Data acquisition, preprocessing, segmentation, feature extraction, feature selection, training, testing, evaluation.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What is segmentation?</div><div class=\"a\">A: Isolating the object of interest from its background before feature extraction.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Difference between feature extraction and feature selection?</div><div class=\"a\">A: Extraction computes new measurements from data; selection chooses which of those features to keep.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Why does error propagate through the pipeline?</div><div class=\"a\">A: Each stage's output feeds the next, so a mistake early (e.g. bad segmentation) corrupts everything downstream.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What is the purpose of the evaluation stage?</div><div class=\"a\">A: To measure how well the classifier performs (e.g. via a confusion matrix) and guide refinement.</div></div>\n</div>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 0, "bcount": 13, "btitle": "1. Definition", "html": "<p><b>Academic:</b> Biometrics is the automated recognition of individuals based on their physiological and/or behavioral characteristics, applying pattern recognition and classification techniques to identity verification and identification.</p>\n<p><b>Plain English:</b> It's using your body or behavior — fingerprint, face, iris, voice, gait — as your ID, instead of a password or a card.</p>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 1, "bcount": 13, "btitle": "2. Keywords", "html": "<div class=\"kw-grid\">\n<span class=\"kw\"><b>Physiological biometric</b> — fingerprint, face, iris, DNA</span>\n<span class=\"kw\"><b>Behavioral biometric</b> — gait, signature, typing rhythm, voice</span>\n<span class=\"kw\">Enrollment</span><span class=\"kw\">Template</span>\n<span class=\"kw\"><b>Verification (1:1)</b> — \"are you who you claim?\"</span>\n<span class=\"kw\"><b>Identification (1:N)</b> — \"who are you, among everyone enrolled?\"</span>\n<span class=\"kw\">Matching score</span>\n<span class=\"kw\"><b>FAR</b> — False Acceptance Rate</span>\n<span class=\"kw\"><b>FRR</b> — False Rejection Rate</span>\n<span class=\"kw\"><b>EER</b> — Equal Error Rate</span>\n<span class=\"kw\">Liveness detection</span><span class=\"kw\">Spoofing</span>\n<span class=\"kw\">Uniqueness</span><span class=\"kw\">Permanence</span><span class=\"kw\">Universality</span><span class=\"kw\">Collectability</span>\n</div>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 2, "bcount": 13, "btitle": "3. Core explanation", "html": "<p><b>What is it?</b> The direct, everyday application of everything covered this week: measuring a body/behavior trait, extracting features, and classifying against enrolled identities.</p>\n<p><b>What does it mean?</b> A good biometric trait should be universal (everyone has it), unique (differs enough between people), permanent (stable over time), and collectable (practical to measure).</p>\n<p><b>Purpose:</b> to confirm or determine identity without relying on something a person can forget, lose, or lend to someone else (like a password or key card).</p>\n<p><b>Why it matters:</b> biometrics underpin phone unlocking, border control, banking security, and forensics.</p>\n<p><b>Problem it solves:</b> passwords and cards can be stolen or shared; biometric traits are tied directly to the individual.</p>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 3, "bcount": 13, "btitle": "4. How it works", "html": "<ol>\n<li><b>Enrollment:</b> a trait is measured and its features are extracted and stored as a template.</li>\n<li><b>Capture:</b> at recognition time, the trait is measured again.</li>\n<li><b>Feature extraction:</b> the new capture is converted into a feature vector the same way as during enrollment.</li>\n<li><b>Matching:</b> the new feature vector is compared to stored template(s), producing a matching score.</li>\n<li><b>Decision:</b> if verifying, the system accepts/rejects against one claimed identity; if identifying, it searches all templates for the best match.</li>\n</ol>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 4, "bcount": 13, "btitle": "5. Diagram", "html": "<pre class=\"ascii\">ENROLLMENT                      RECOGNITION\nTrait ──► Feature ──► Template   Trait ──► Feature ──► Query vector\n              │  (stored)                                  │\n              └──────────────────► Matching ◄───────────────┘\n                                      │\n                              Verification (1:1)   or   Identification (1:N)\n                                      │\n                                  Accept / Reject / Identity</pre>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 5, "bcount": 13, "btitle": "6. Example", "html": "<p>Unlocking a phone with Face ID: your face was enrolled once as a template; each unlock attempt captures your face again and checks it matches (verification, 1:1).</p>\n<p>An airport border system that identifies a traveler against a watchlist of thousands of faces is doing identification (1:N) rather than verification.</p>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 6, "bcount": 13, "btitle": "7. Applications", "html": "<ul>\n<li><b>Consumer devices:</b> fingerprint/face unlock on phones and laptops.</li>\n<li><b>Border control:</b> passport e-gates using face or iris recognition.</li>\n<li><b>Banking:</b> voice or fingerprint authentication for transactions.</li>\n<li><b>Forensics:</b> matching fingerprints or DNA to crime scene evidence.</li>\n<li><b>Attendance/access systems:</b> workplace entry via fingerprint or face.</li>\n</ul>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 7, "bcount": 13, "btitle": "8. Advantages", "html": "<ul>\n<li><b>Hard to lose or share:</b> unlike a password, you always \"have\" your fingerprint or face.</li>\n<li><b>Convenience:</b> nothing to remember or carry.</li>\n<li><b>Strong link to identity:</b> harder to impersonate than knowledge-based credentials.</li>\n</ul>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 8, "bcount": 13, "btitle": "9. Limitations", "html": "<ul>\n<li><b>Privacy concerns:</b> biometric data is sensitive and, unlike a password, can't be \"reset\" if compromised.</li>\n<li><b>Spoofing risk:</b> photos, fake fingerprints, or recordings can attempt to fool a system without liveness detection.</li>\n<li><b>Trait changes over time:</b> injuries, aging, or illness can alter a trait and increase false rejections.</li>\n<li><b>Cost and infrastructure:</b> high-quality sensors and matching systems can be expensive to deploy.</li>\n</ul>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 9, "bcount": 13, "btitle": "10. Comparisons", "html": "<table class=\"cmp\">\n<tr><th></th><th>Physiological biometric</th><th>Behavioral biometric</th></tr>\n<tr><td>Based on</td><td>Physical body traits</td><td>Patterns of behavior</td></tr>\n<tr><td>Examples</td><td>Fingerprint, face, iris, DNA</td><td>Gait, signature, typing rhythm, voice</td></tr>\n<tr><td>Stability</td><td>Generally more stable</td><td>Can vary with mood, stress, context</td></tr>\n</table>\n<table class=\"cmp\">\n<tr><th></th><th>Verification (1:1)</th><th>Identification (1:N)</th></tr>\n<tr><td>Question asked</td><td>\"Are you who you claim?\"</td><td>\"Who are you, among all enrolled?\"</td></tr>\n<tr><td>Comparisons made</td><td>One</td><td>Many (against the whole database)</td></tr>\n<tr><td>Example</td><td>Unlocking your own phone</td><td>Airport watchlist screening</td></tr>\n</table>\n<p><b>Common confusion:</b> verification and identification are often used interchangeably, but they are different matching problems — one comparison vs. a search across many.</p>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 10, "bcount": 13, "btitle": "11. Mathematical / formula component", "html": "<p><b>False Acceptance Rate (FAR):</b> the proportion of impostor attempts wrongly accepted. <b>False Rejection Rate (FRR):</b> the proportion of genuine attempts wrongly rejected. The <b>Equal Error Rate (EER)</b> is the point where FAR = FRR — a common single-number summary of a biometric system's accuracy. Lower EER means a more accurate system.</p>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 11, "bcount": 13, "btitle": "Recap", "html": "<div class=\"anchor-box\"><b>MEMORY ANCHOR</b>\"Enroll once, match every time.\" Biometrics is the classification pipeline running against a single question: does this match a stored template?</div><div class=\"must-remember\">\n<b>MUST REMEMBER</b>\n<ol>\n<li>Biometrics = identity recognition from physiological or behavioral traits.</li>\n<li>Pipeline: enrollment → capture → feature extraction → matching → decision.</li>\n<li>Verification is 1:1 (\"are you who you claim?\"); identification is 1:N (\"who are you?\").</li>\n<li>A good trait is universal, unique, permanent, and collectable.</li>\n<li>FAR, FRR, and EER quantify a biometric system's accuracy.</li>\n</ol>\n</div>"}, {"cid": "c6", "cindex": 5, "cnum": "06", "ctitle": "Biometrics", "cbuilds": "Builds on all five prior concepts — biometrics is a complete, real-world application of the whole pipeline.", "bindex": 12, "bcount": 13, "btitle": "Flashcards", "html": "<div class=\"flashcards\">\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Define biometrics.</div><div class=\"a\">A: Automated recognition of individuals based on physiological/behavioral traits, using pattern recognition and classification.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Verification vs identification — what's the difference?</div><div class=\"a\">A: Verification is a 1:1 check against a claimed identity; identification is a 1:N search across all enrolled identities.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Give two examples each of physiological and behavioral biometrics.</div><div class=\"a\">A: Physiological: fingerprint, face/iris/DNA. Behavioral: gait, signature/typing rhythm/voice.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What do FAR and FRR measure?</div><div class=\"a\">A: FAR = rate of wrongly accepting impostors; FRR = rate of wrongly rejecting genuine users.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: What is the Equal Error Rate (EER)?</div><div class=\"a\">A: The point where FAR equals FRR — a single-number summary of biometric system accuracy; lower is better.</div></div>\n<div class=\"fc\" onclick=\"this.classList.toggle('revealed')\"><span class=\"hint\">tap</span><div class=\"q\">Q: Why is biometric data considered higher-risk than a password if compromised?</div><div class=\"a\">A: Unlike a password, a biometric trait cannot be \"reset\" once its data is stolen.</div></div>\n</div>"}, {"cid": "map", "cindex": 6, "cnum": "◆", "ctitle": "Master Map", "cbuilds": "How all six concepts connect, on one page.", "bindex": 0, "bcount": 1, "btitle": "Master Map", "html": "<div class=\"mapcard\">\n<svg style=\"min-width:640px;\" viewbox=\"0 0 900 430\" width=\"100%\">\n<defs>\n<marker id=\"arrow\" markerheight=\"8\" markerwidth=\"8\" orient=\"auto\" refx=\"6\" refy=\"3\">\n<path d=\"M0,0 L6,3 L0,6 z\" fill=\"#B9C4C1\"></path>\n</marker>\n</defs>\n<path class=\"mapedge\" d=\"M150,50 L150,110\" marker-end=\"url(#arrow)\"></path>\n<path class=\"mapedge\" d=\"M150,150 L150,210\" marker-end=\"url(#arrow)\"></path>\n<path class=\"mapedge\" d=\"M150,250 L150,310\" marker-end=\"url(#arrow)\"></path>\n<path class=\"mapedge\" d=\"M270,330 C 400,330 400,330 470,330\" marker-end=\"url(#arrow)\"></path>\n<path class=\"mapedge\" d=\"M590,330 C 650,330 650,330 690,330\" marker-end=\"url(#arrow)\"></path>\n<path class=\"mapedge\" d=\"M150,350 C 150,390 350,410 470,370\" marker-end=\"url(#arrow)\"></path>\n<path class=\"mapedge\" d=\"M150,250 C 350,250 550,150 690,150\" marker-end=\"url(#arrow)\"></path>\n<g class=\"mapnode core\">\n<rect height=\"38\" rx=\"8\" width=\"180\" x=\"60\" y=\"15\"></rect>\n<text text-anchor=\"middle\" x=\"150\" y=\"39\">Pattern Recognition</text>\n</g>\n<text class=\"maplabel\" text-anchor=\"middle\" x=\"150\" y=\"72\">discipline / umbrella</text>\n<g class=\"mapnode\">\n<rect height=\"38\" rx=\"8\" width=\"180\" x=\"60\" y=\"115\"></rect>\n<text text-anchor=\"middle\" x=\"150\" y=\"139\">Measured Patterns</text>\n</g>\n<text class=\"maplabel\" text-anchor=\"middle\" x=\"150\" y=\"172\">sensing → raw data</text>\n<g class=\"mapnode\">\n<rect height=\"38\" rx=\"8\" width=\"180\" x=\"60\" y=\"215\"></rect>\n<text text-anchor=\"middle\" x=\"150\" y=\"239\">Classes</text>\n</g>\n<text class=\"maplabel\" text-anchor=\"middle\" x=\"150\" y=\"272\">predefined categories</text>\n<g class=\"mapnode core\">\n<rect height=\"38\" rx=\"8\" width=\"180\" x=\"60\" y=\"315\"></rect>\n<text text-anchor=\"middle\" x=\"150\" y=\"339\">Classification</text>\n</g>\n<text class=\"maplabel\" text-anchor=\"middle\" x=\"150\" y=\"372\">decision rule</text>\n<g class=\"mapnode\">\n<rect height=\"38\" rx=\"8\" width=\"220\" x=\"470\" y=\"315\"></rect>\n<text text-anchor=\"middle\" x=\"580\" y=\"339\">Steps of Classification</text>\n</g>\n<text class=\"maplabel\" text-anchor=\"middle\" x=\"580\" y=\"372\">the full 8-stage pipeline</text>\n<g class=\"mapnode app\">\n<rect height=\"38\" rx=\"8\" width=\"180\" x=\"700\" y=\"130\"></rect>\n<text text-anchor=\"middle\" x=\"790\" y=\"154\">Biometrics</text>\n</g>\n<text class=\"maplabel\" text-anchor=\"middle\" x=\"790\" y=\"187\">real-world application</text>\n<text class=\"maplabel\" text-anchor=\"middle\" x=\"150\" y=\"410\">each concept below feeds the one above it</text>\n</svg>\n</div><div class=\"anchor-box\" style=\"margin-top:1rem;\">\n<b>THE STORY IN ONE LINE</b>\n      Pattern recognition is the field; measured patterns are what you feed it; classes are what you're sorting into; classification is the act of sorting; the 8 steps are how that sorting is actually built; and biometrics is that entire pipeline, applied to proving who you are.\n    </div>"}, {"cid": "test", "cindex": 7, "cnum": "◆", "ctitle": "Foundation Test", "cbuilds": "Pattern Recognition Week 1 — 30 questions covering measured patterns, classes, classification, the classification pipeline and biometrics. Click an answer for immediate correction and explanation. Your final score is shown at the end.", "bindex": 0, "bcount": 1, "btitle": "30-Question Test", "html": "<div id=\"foundationQuiz\"></div><div class=\"anchor-box\" id=\"foundationScore\" style=\"display:none;\"></div>"}]</script>
