<style>
:root{
  --paper:#eef1ee;--paper-raised:#fbfbf9;--ink:#16211d;--ink-soft:#57655f;--ink-faint:#8d9891;
  --rule:#d4dbd4;--rule-strong:#aebab2;--mark:#bd3d27;
  --good:#1f7a52;--good-soft:#e2efe6;--bad:#b23a2b;--bad-soft:#f6e2dd;
  --accent:#a8721f;--accent-soft:#f3e8d4;
  --display:"Fraunces",Georgia,serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  background-color:var(--paper);
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:38px 38px;background-position:-1px -1px;
  height:100vh;overflow:hidden;display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);font-weight:650;letter-spacing:-.01em;color:var(--ink);margin:0}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px;border-bottom:1px solid var(--rule-strong);background:rgba(238,241,238,.9);backdrop-filter:blur(6px);flex:0 0 auto}
.topbar nav{display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
.topbar nav a:hover{color:var(--accent)}
.topbar .title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--accent);font-weight:600}

/* concept jump strip */
.jumpstrip{display:flex;gap:6px;overflow-x:auto;padding:10px 22px;border-bottom:1px solid var(--rule);flex:0 0 auto;background:var(--paper)}
.jumpstrip::-webkit-scrollbar{height:5px}
.jumppill{flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-soft);background:var(--paper-raised);border:1px solid var(--rule);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
.jumppill:hover{border-color:var(--rule-strong);color:var(--ink)}
.jumppill.active{background:var(--ink);border-color:var(--ink);color:#f3f1ea}

/* stage */
.stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;padding:0 150px 0 70px}
.arrowbtn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--paper-raised);display:grid;place-items:center;cursor:pointer;color:var(--ink);font-size:18px;transition:all .15s ease;z-index:5}
.arrowbtn:hover:not(:disabled){background:var(--ink);color:#f3f1ea;border-color:var(--ink)}
.arrowbtn:disabled{opacity:.25;cursor:default}
.arrowbtn.prev{left:12px}.arrowbtn.next{right:92px}

.slidewrap{width:100%;max-width:900px;height:calc(100% - 28px);max-height:none;margin:14px 0;background:var(--paper-raised);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:6px;padding:28px 34px;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}
.slidecontent{width:100%;transform-origin:top center;will-change:transform}
.slide-eyebrow{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.slide-eyebrow .cnum{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.slide-eyebrow .ctitle{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
.slide-btitle{font-size:26px;margin:2px 0 6px}
.slide-builds{font-family:var(--sans);font-size:13.5px;color:var(--ink-soft);margin:0 0 20px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.slide-body{font-size:15.5px;line-height:1.65;color:var(--ink)}
.slide-body p{margin:0 0 12px}
.slide-body b{color:var(--ink);font-weight:600}
.slide-body ul,.slide-body ol{padding-left:20px;margin:0 0 12px}
.slide-body li{margin:5px 0}

.kw-grid{display:flex;flex-wrap:wrap;gap:8px}
.kw{background:var(--accent-soft);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
.kw b{color:var(--accent)}

pre.ascii{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.6;overflow-x:auto;color:var(--ink)}

table.cmp{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:14px}
table.cmp th,table.cmp td{border:1px solid var(--rule);padding:9px 11px;text-align:left}
table.cmp th{background:var(--paper);font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-soft);text-transform:uppercase}

.anchor-box{background:var(--accent-soft);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:4px;padding:14px 16px;margin:14px 0;font-size:14.5px;line-height:1.55}
.anchor-box b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}
.must-remember{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;margin:14px 0}
.must-remember b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:8px}
.must-remember ol{margin:0;padding-left:18px}
.must-remember li{margin:5px 0;font-size:14.5px}

.flashcards{display:grid;gap:10px}
.fc{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;cursor:pointer;position:relative}
.fc .hint{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
.fc .q{font-weight:600;font-size:14.5px}
.fc .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule-strong);font-size:14px;color:var(--ink-soft)}
.fc.revealed .a{display:block}
.fc.revealed{border-color:var(--accent)}

.mapcard{overflow-x:auto}
.mapcard svg text{font-family:var(--sans);fill:var(--ink)}
.mapedge{fill:none;stroke:var(--rule-strong);stroke-width:1.6}
.mapnode rect{fill:var(--paper-raised);stroke:var(--rule-strong);stroke-width:1.2}
.mapnode.core rect{fill:var(--accent-soft);stroke:var(--accent)}
.mapnode.app rect{fill:var(--paper);stroke:var(--accent);stroke-dasharray:3 2}
.mapnode text{font-size:13px;font-weight:600}
.maplabel{font-size:10.5px;fill:var(--ink-soft)}

.testgroup{border:1px solid var(--rule);border-radius:4px;padding:16px 18px;margin:0 0 12px;background:var(--paper)}
.testgroup h4{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--accent);margin:0 0 8px;text-transform:none;font-weight:600}
.testgroup>p{font-size:15px;margin:0 0 10px}
.test-option{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--paper-raised);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;margin:6px 0;cursor:pointer;font:inherit;color:var(--ink)}
.test-option b{font-family:var(--mono);border:1px solid var(--rule-strong);border-radius:3px;min-width:24px;height:24px;display:grid;place-items:center;font-size:11px;color:var(--ink-soft)}
.test-option.correct{background:var(--good-soft);border-color:var(--good)}
.test-option.wrong{background:var(--bad-soft);border-color:var(--bad)}
.test-feedback{padding:10px 12px;border-radius:4px;margin-top:8px;line-height:1.5;font-size:14px}
.test-feedback.good{background:var(--good-soft)}
.test-feedback.bad{background:var(--bad-soft)}
.reset-test{margin-top:10px;border:0;border-radius:4px;background:var(--ink);color:#f3f1ea;padding:9px 14px;cursor:pointer;font:inherit}

/* circular study progress */
.progress-rail{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:72px;display:flex;flex-direction:column;align-items:center;gap:7px;z-index:4}
.progress-ring{width:68px;height:68px;display:block}
.progress-ring-track{fill:none;stroke:var(--rule);stroke-width:7}
.progress-ring-value{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s ease}
.progress-ring-text{font-family:var(--mono);font-size:12px;font-weight:700;fill:var(--ink)}
.progress-caption{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);text-align:center;line-height:1.2}
@media(max-width:900px){.progress-rail{right:2px;width:58px}.progress-ring{width:56px;height:56px}.stage{padding:0 60px 0 48px}.arrowbtn.prev{left:2px}.arrowbtn.next{right:64px}.progress-caption{font-size:8px}}

/* footer / progress */
.footbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 22px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
.dots{display:flex;gap:4px}
.dots span{width:5px;height:5px;border-radius:50%;background:var(--rule-strong)}
.dots span.on{background:var(--accent);width:14px;border-radius:3px}

@media(max-width:700px){
  .stage{padding:0 8px}
  .arrowbtn{width:38px;height:38px}
  .arrowbtn.prev{left:2px}.arrowbtn.next{right:2px}
  .slidewrap{padding:22px 18px;height:calc(100% - 16px);margin:8px 0}
.slidecontent{transform-origin:top center}
  .slide-btitle{font-size:21px}
}
</style>
