Object.entries(qs).forEach(([c,a])=>{all.push(...a)});
let selected=null,mode='concept',pool=[],pos=0,score=0,attempted=0;
function build(){document.getElementById('menu').innerHTML=Object.entries(defs).map(([g,items])=>`<div class="gt">${g}</div>`+items.map(x=>`<button class="concept" data-name="${x[0]}" onclick="choose('${x[0].replaceAll("'","\\'")}')">${x[0]}</button>`).join('')).join('')}
function choose(n){selected=n;mode='concept';pos=0;score=0;attempted=0;pool=[...all.filter(q=>q.name===n)];shuffle(pool);document.querySelectorAll('.concept').forEach(b=>b.classList.toggle('active',b.dataset.name===n));showLearn();showQ();stats()}
function mixed(){selected=null;mode='mixed';pos=0;score=0;attempted=0;pool=[...all];shuffle(pool);document.querySelectorAll('.concept').forEach(b=>b.classList.remove('active'));document.getElementById('learn').innerHTML='<div class="learn"><h2>🔥 Mixed Exam</h2><p>Questions are drawn from all Relations, Relation Properties, Partial Orders, and Rules of Inference topics. Expect worked examples, concrete relations, symbolic reasoning, and real-world inference scenarios.</p></div>';showQ();stats()}
function retry(){if(selected)choose(selected);else mixed()}
function resetScore(){score=0;attempted=0;stats()}
function showLearn(){if(!selected)return;const x=Object.values(defs).flat().find(a=>a[0]===selected);document.getElementById('learn').innerHTML=`<div class="learn"><h2>${selected}</h2><p>${x[1]}</p><div class="formula">${x[2]}</div></div>`}
function showQ(){const el=document.getElementById('quiz');if(!pool.length){el.innerHTML='<div class="empty">Choose a concept.</div>';return}if(pos>=pool.length){el.innerHTML=`<div class="question"><h2>🎉 Complete!</h2><p>Score: <strong>${score}/${attempted}</strong></p><p>Review any missed questions and retry the concept when ready.</p><button class="next show" onclick="retry()">Try again →</button></div>`;return}const q=pool[pos];el.innerHTML=`<div class="question"><div class="qtop"><span>${mode==='mixed'?q.name+' · ':''}Question ${pos+1} of ${pool.length}</span><span>Immediate feedback</span></div><h2>${q[0]}</h2>${q[1].map((o,i)=>`<button class="option" onclick="answer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}<div id="fb" class="feedback"></div><button id="nx" class="next" onclick="next()">Next question →</button></div>`}
function answer(i){const q=pool[pos],opts=document.querySelectorAll('.option');opts.forEach(o=>o.disabled=true);attempted++;let good=i===q[2];if(good){score++;opts[i].classList.add('correct')}else{opts[i].classList.add('wrong');opts[q[2]].classList.add('correct')}const fb=document.getElementById('fb');fb.className='feedback show '+(good?'good':'bad');fb.innerHTML=(good?'🟢 <b>Correct!</b> ':'🔴 <b>Incorrect.</b> ')+q[3];document.getElementById('nx').classList.add('show');stats()}
function next(){pos++;showQ();stats()}
function stats(){document.getElementById('score').textContent=`${score} / ${attempted}`;document.getElementById('status').textContent=mode==='mixed'?'Mixed Exam':selected?`${selected} · ${Math.min(pos+1,pool.length)} / ${pool.length}`:'Select a concept to begin.'}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
build();
</script></body></html>
