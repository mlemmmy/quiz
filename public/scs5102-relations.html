<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCS5102 Relations & Rules of Inference</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 20px 70px}nav{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding-bottom:16px;color:#666}a{color:inherit;text-decoration:none}.pill{display:inline-block;background:#171717;color:#fff;border-radius:25px;padding:8px 13px;font-size:11px;font-weight:900;letter-spacing:.12em}.hero{padding:52px 0 30px}.hero h1{font-size:clamp(44px,7vw,76px);line-height:.95;letter-spacing:-.06em;margin:28px 0 18px}.hero p{color:#6c6c67;font-size:18px;line-height:1.55;max-width:800px}.layout{display:grid;grid-template-columns:285px 1fr;gap:18px}.panel,.stats,.learn,.question{background:#fff;border:1px solid #deded9;border-radius:20px}.panel{padding:14px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}.panel h3{margin:7px}.gt{font-size:10px;font-weight:900;letter-spacing:.12em;color:#777;margin:16px 7px 7px}.concept{display:block;width:100%;border:1px solid #e0e0db;background:#fafaf8;border-radius:11px;padding:10px;text-align:left;margin:5px 0;font-weight:700;cursor:pointer}.concept.active{background:#171717;color:#fff}.stats{padding:16px 19px;display:flex;gap:18px;align-items:center;margin-bottom:14px}.stats strong{font-size:27px}.stats span{color:#6c6c67}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.controls button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.learn{padding:20px;margin-bottom:14px}.learn h2{margin-top:0}.learn p{line-height:1.6;color:#5f5f5a}.formula{background:#f2f2ee;border-radius:10px;padding:12px;font-family:ui-monospace,monospace;white-space:pre-wrap}.question{padding:23px}.qtop{font-size:12px;color:#777;font-weight:800;display:flex;justify-content:space-between}.question h2{font-size:21px;line-height:1.45}.option{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:1px solid #ddd;background:#fff;border-radius:12px;padding:13px;margin:8px 0;cursor:pointer}.option:disabled{cursor:default}.letter{border:1px solid #ddd;border-radius:50%;min-width:29px;height:29px;display:grid;place-items:center;font-weight:900}.correct{background:#e7f4e9!important;border-color:#79a983!important}.wrong{background:#f8e7e7!important;border-color:#c68080!important}.feedback{display:none;padding:14px;border-radius:12px;margin-top:13px;line-height:1.55}.feedback.show{display:block}.good{background:#eef7ef}.bad{background:#fbefef}.next{display:none;background:#171717;color:#fff;border:0;border-radius:11px;padding:13px 16px;font-weight:800;margin-top:12px;cursor:pointer}.next.show{display:inline-block}.empty{text-align:center;padding:48px;background:#fff;border:1px dashed #ccc;border-radius:18px;color:#777}@media(max-width:820px){.layout{grid-template-columns:1fr}.panel{position:static;max-height:none}.hero{padding-top:35px}}
</style></head><body><div class="wrap"><nav><a href="/">← Study Hub</a><span>SCS5102</span></nav><section class="hero"><span class="pill">INTERACTIVE PRACTICE</span><h1>Relations & Rules of Inference</h1><p>Choose exactly what you want to practise. Each concept has a question bank with immediate correction, explanations, score tracking, and a mixed exam mode.</p></section><div class="layout"><aside class="panel"><h3>Choose a concept</h3><div id="menu"></div></aside><main><div class="stats"><strong id="score">0 / 0</strong><span id="status">Select a concept to begin.</span></div><div class="controls"><button onclick="mixed()">🔥 Mixed Exam</button><button onclick="retry()">↻ Retry</button><button onclick="resetScore()">Reset score</button></div><div id="learn"></div><div id="quiz"></div></main></div></div><script>
const defs={
'Relations':[ ['Cartesian Product','A×B is the set of all ordered pairs with first component in A and second in B.','A × B = {(a,b) | a∈A, b∈B}'],['Binary Relations','A binary relation from A to B is a subset of A×B.','R ⊆ A × B'],['Relation from A to B','A relation from A to B selects ordered pairs from A×B; aRb means (a,b)∈R.','aRb ⇔ (a,b)∈R'],['Relation on A','A relation on A is a relation from A to itself.','R ⊆ A × A'],['Domain & Range','The domain contains first components that occur; the range contains second components that occur.','Dom(R)={a | ∃b,(a,b)∈R}; Ran(R)={b | ∃a,(a,b)∈R}']],
'Relation Properties':[ ['Reflexive','Every element is related to itself.','∀a∈A, (a,a)∈R'],['Irreflexive','No element is related to itself.','∀a∈A, (a,a)∉R'],['Symmetric','Whenever aRb, bRa also holds.','aRb ⇒ bRa'],['Antisymmetric','If aRb and bRa, then a=b.','aRb ∧ bRa ⇒ a=b'],['Transitive','If aRb and bRc, then aRc.','aRb ∧ bRc ⇒ aRc'],['Antitransitive','If aRb and bRc, then aRc must not hold.','aRb ∧ bRc ⇒ ¬aRc'],['Inverse Relations','The inverse reverses every ordered pair in R.','R⁻¹={(b,a)|(a,b)∈R}'],['Composition of Relations','Composition follows a chain through a shared middle element.','S∘R={(a,c)|∃b,(a,b)∈R,(b,c)∈S}'],['Equivalence Relations','An equivalence relation is reflexive, symmetric, and transitive.','R + S + T']],
'Partial Orders':[ ['Partial Orders','A partial order is reflexive, antisymmetric, and transitive.','R + A + T'],['Total / Linear Orders','A total order is a partial order where every pair is comparable.','Partial order + comparability'],['Strict Partial Orders','A strict partial order is irreflexive and transitive.','I + T'],['Well-Orders','A well-order is a total order where every nonempty subset has a least element.','Total order + least element property']],
'Rules of Inference':[ ['Modus Ponens','From p and p→q, infer q.','p, p→q ⟹ q'],['Modus Tollens','From p→q and ¬q, infer ¬p.','p→q, ¬q ⟹ ¬p'],['Hypothetical Syllogism','Chain two conditionals.','p→q, q→r ⟹ p→r'],['Disjunctive Syllogism','From p∨q and ¬p, infer q.','p∨q, ¬p ⟹ q'],['Addition','From p, infer p∨q.','p ⟹ p∨q'],['Simplification','From p∧q, infer p or q.','p∧q ⟹ p (or q)'],['Conjunction','From p and q, infer p∧q.','p,q ⟹ p∧q'],['Resolution','Resolve complementary literals in two disjunctions.','p∨q, ¬p∨r ⟹ q∨r'],['Valid vs Invalid Arguments','Valid arguments preserve truth from premises to conclusion; affirming the consequent and denying the antecedent are invalid.','p→q,q ⟹ p  INVALID\np→q,¬p ⟹ ¬q  INVALID']]
};
const all=[];Object.entries(defs).forEach(([group,items])=>items.forEach(([name,desc,formula])=>{for(let i=0;i<10;i++)all.push(makeQ(group,name,desc,formula,i))}));
function makeQ(group,name,desc,formula,i){const qs=[
[`Which statement best defines ${name}?`,[desc,formula,'It is always symmetric.','It applies only to functions.'],0,desc],
[`Which formula is associated with ${name}?`,[formula,'A×B=∅','p↔q','R=A∪B'],0,formula],
[`In an exam, the safest first step for ${name} is to use its defining condition. Which is the defining idea?`,[desc,'Ignore the relation pairs','Assume every relation is a function','Check only the set size'],0,desc],
[`Which option is NOT the defining condition of ${name}?`,['The defining condition shown in the notes',formula,'A random unrelated condition','The formal definition'],2,'The unrelated condition is not part of the definition.'],
[`True or false: the formula shown for ${name} identifies its formal condition.`,['True','False','Only sometimes','Only for finite sets'],0,`The formal condition is ${formula}.`],
[`If a question asks you to recognise ${name}, what should you compare first?`,['The relation against its defining properties','The colour of the diagram','The number of letters in R','Nothing'],0,`Compare the given relation with: ${formula}.`],
[`Which mathematical symbol/pattern appears in the definition of ${name}?`,[formula,'A−B','A∩B only','x+y=z'],0,formula],
[`A student says “${name} has a different definition for every set.” Is that correct?`,['No—the defining rule stays the same','Yes','Only for infinite sets','Only for numbers'],0,`The definition is fixed; the relation/set changes.`],
[`Which description would help you identify ${name} quickly?`,[desc,'Every pair must be present','No ordered pairs are allowed','It is automatically a function'],0,desc],
[`Exam check: if the given relation satisfies ${name}'s defining rule, what can you say?`,['It has the property','It must be an empty relation','It cannot be a relation','It must be symmetric'],0,`It satisfies the defining condition for ${name}.`]
];return {...qs[i],group,name}}
let selected=null,mode='concept',pool=[],pos=0,score=0,attempted=0;
function build(){document.getElementById('menu').innerHTML=Object.entries(defs).map(([g,items])=>`<div class="gt">${g}</div>`+items.map(x=>`<button class="concept" data-name="${x[0]}" onclick="choose('${x[0].replaceAll("'","\\'")}')">${x[0]}</button>`).join('')).join('')}
function choose(n){selected=n;mode='concept';pos=0;score=0;attempted=0;pool=all.filter(q=>q.name===n);shuffle(pool);document.querySelectorAll('.concept').forEach(b=>b.classList.toggle('active',b.dataset.name===n));showLearn();showQ();stats()}
function mixed(){selected=null;mode='mixed';pos=0;score=0;attempted=0;pool=[...all];shuffle(pool);document.querySelectorAll('.concept').forEach(b=>b.classList.remove('active'));document.getElementById('learn').innerHTML='<div class="learn"><h2>🔥 Mixed Exam</h2><p>Questions are drawn from every Relations, Partial Orders, and Rules of Inference concept.</p></div>';showQ();stats()}
function retry(){if(selected)choose(selected);else mixed()}
function resetScore(){score=0;attempted=0;stats()}
function showLearn(){if(!selected)return;const x=Object.values(defs).flat().find(a=>a[0]===selected);document.getElementById('learn').innerHTML=`<div class="learn"><h2>${selected}</h2><p>${x[1]}</p><div class="formula">${x[2]}</div></div>`}
function showQ(){const el=document.getElementById('quiz');if(!pool.length){el.innerHTML='<div class="empty">Choose a concept.</div>';return}if(pos>=pool.length){el.innerHTML=`<div class="question"><h2>🎉 Complete!</h2><p>Score: <strong>${score}/${attempted}</strong></p><button class="next show" onclick="retry()">Try again →</button></div>`;return}const q=pool[pos];el.innerHTML=`<div class="question"><div class="qtop"><span>${mode==='mixed'?q.name+' · ':''}Question ${pos+1} of ${pool.length}</span><span>Immediate feedback</span></div><h2>${q[0]}</h2>${q[1].map((o,i)=>`<button class="option" onclick="answer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}<div id="fb" class="feedback"></div><button id="nx" class="next" onclick="next()">Next question →</button></div>`}
function answer(i){const q=pool[pos],opts=document.querySelectorAll('.option');opts.forEach(o=>o.disabled=true);attempted++;let good=i===q[2];if(good){score++;opts[i].classList.add('correct')}else{opts[i].classList.add('wrong');opts[q[2]].classList.add('correct')}const fb=document.getElementById('fb');fb.className='feedback show '+(good?'good':'bad');fb.innerHTML=(good?'🟢 <b>Correct!</b> ':'🔴 <b>Incorrect.</b> ')+q[3];document.getElementById('nx').classList.add('show');stats()}
function next(){pos++;showQ();stats()}
function stats(){document.getElementById('score').textContent=`${score} / ${attempted}`;document.getElementById('status').textContent=mode==='mixed'?'Mixed Exam':selected?`${selected} · ${Math.min(pos+1,pool.length)} / ${pool.length}`:'Select a concept to begin.'}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
build();
</script></body></html>
