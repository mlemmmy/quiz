<script>window.__FOUNDATION_QUESTIONS__ = [{"concept": "Pattern Recognition", "question": "A pattern is best described as…", "options": ["A measurable set of characteristics used to describe an object/event", "Only a picture", "A database table", "A random guess"], "answer": 0, "explanation": "Patterns are represented through measurable characteristics so they can be analyzed and classified."}, {"concept": "Pattern Recognition", "question": "Which is a typical pattern-recognition pipeline?", "options": ["Sensing → preprocessing → feature extraction → classification → decision/output", "Printing → scanning → deleting → saving", "Database → password → printer → monitor", "Sorting → formatting → emailing → archiving"], "answer": 0, "explanation": "The lecture presents sensing, preprocessing, feature extraction, classification and decision/output as the core pipeline."}, {"concept": "Measured Patterns", "question": "A measured pattern is…", "options": ["Raw measurements obtained from an object through sensing", "A final class label", "A decision boundary", "A visualization legend"], "answer": 0, "explanation": "Measured patterns are the quantitative or qualitative measurements taken from an object before further processing."}, {"concept": "Measured Patterns", "question": "Which scale has categories with no inherent order?", "options": ["Nominal", "Ordinal", "Interval", "Ratio"], "answer": 0, "explanation": "Nominal data identify categories without a meaningful ranking."}, {"concept": "Measured Patterns", "question": "A transducer primarily…", "options": ["Converts a physical quantity into an electrical signal", "Assigns a class label", "Draws a histogram", "Removes all noise mathematically"], "answer": 0, "explanation": "A transducer converts quantities such as light, pressure or sound into signals that can be measured."}, {"concept": "Classes", "question": "In supervised pattern recognition, a class is…", "options": ["A predefined category used as a target label", "A random group found without labels", "A sensor reading", "A feature-extraction algorithm"], "answer": 0, "explanation": "Classes are predefined categories that the classifier learns to distinguish."}, {"concept": "Classes", "question": "Within-class variability means…", "options": ["Differences among members of the same class", "Differences between two classes only", "Measurement noise only", "The number of classes"], "answer": 0, "explanation": "Within-class variability describes how members of one class can differ from each other."}, {"concept": "Classification", "question": "Classification means…", "options": ["Assigning a pattern to one of several predefined classes", "Compressing an image", "Collecting raw sensor data", "Drawing a chart"], "answer": 0, "explanation": "Classification uses a decision rule to assign a feature vector to a predefined class."}, {"concept": "Classification", "question": "A decision boundary separates…", "options": ["Regions associated with different classes in feature space", "Training from testing files only", "Pixels from sensors", "Tables from charts"], "answer": 0, "explanation": "A decision boundary is the surface separating class regions in feature space."}, {"concept": "Classification", "question": "A discriminant function gᵢ(x) is used to…", "options": ["Score how strongly x belongs to class i", "Store an image", "Measure internet speed", "Define a database schema"], "answer": 0, "explanation": "The class with the highest discriminant score is selected by the simple decision rule described in the lecture."}, {"concept": "Steps of Classification", "question": "Which stage isolates the object of interest from its background?", "options": ["Segmentation", "Feature selection", "Testing", "Evaluation"], "answer": 0, "explanation": "Segmentation isolates the object of interest before useful features are extracted."}, {"concept": "Steps of Classification", "question": "Feature extraction differs from feature selection because extraction…", "options": ["Computes new informative measurements, while selection chooses features to keep", "Deletes all features", "Only labels classes", "Always happens after evaluation"], "answer": 0, "explanation": "Extraction creates/derives features; selection chooses which available features are retained."}, {"concept": "Steps of Classification", "question": "Why can an early pipeline error affect later stages?", "options": ["Each stage feeds its output into the next stage", "Later stages ignore earlier outputs", "Only the final stage uses data", "Errors disappear automatically"], "answer": 0, "explanation": "Because stages are connected, poor preprocessing or segmentation can corrupt downstream results."}, {"concept": "Biometrics", "question": "Biometrics recognizes people using…", "options": ["Physiological or behavioral traits", "Only passwords", "Only usernames", "Only geographic location"], "answer": 0, "explanation": "Biometrics uses physiological or behavioral characteristics for automated recognition."}, {"concept": "Biometrics", "question": "Verification is a…", "options": ["1:1 comparison against a claimed identity", "1:N search across every enrolled identity", "Random comparison", "Comparison with no stored template"], "answer": 0, "explanation": "Verification asks whether you are who you claim to be and is a one-to-one check."}, {"concept": "Biometrics", "question": "Identification is a…", "options": ["1:N search across enrolled identities", "1:1 check only", "Password reset", "Feature-selection step"], "answer": 0, "explanation": "Identification asks who you are among enrolled identities, requiring a search across many templates."}, {"concept": "Biometrics", "question": "FAR measures…", "options": ["Impostor attempts wrongly accepted", "Genuine users wrongly rejected", "All successful logins", "The number of enrolled users"], "answer": 0, "explanation": "False Acceptance Rate is the rate at which impostors are incorrectly accepted."}, {"concept": "Biometrics", "question": "FRR measures…", "options": ["Genuine attempts wrongly rejected", "Impostors wrongly accepted", "Number of sensors", "Number of classes"], "answer": 0, "explanation": "False Rejection Rate is the rate at which genuine users are incorrectly rejected."}, {"concept": "Biometrics", "question": "EER occurs when…", "options": ["FAR equals FRR", "FAR is zero in every case", "FRR equals 100%", "There are no enrolled users"], "answer": 0, "explanation": "Equal Error Rate is the point at which false acceptance and false rejection rates are equal."}, {"concept": "Pattern Recognition", "question": "Which is an example of pattern-recognition application?", "options": ["Fraud detection", "Typing a document manually", "Turning on a monitor", "Charging a battery"], "answer": 0, "explanation": "The lecture lists fraud detection among real-world applications of pattern recognition."}, {"concept": "Pattern Recognition", "question": "A feature vector is best represented as…", "options": ["An ordered list of numerical feature values", "A class name only", "A paragraph of text only", "A password"], "answer": 0, "explanation": "A feature vector such as [x₁,…,x_d] represents measurable properties of one pattern."}, {"concept": "Classification", "question": "Why are points near a decision boundary risky?", "options": ["Small noise can change the class decision", "They always belong to both classes", "They contain no features", "They cannot be tested"], "answer": 0, "explanation": "Points close to the boundary can switch class under small measurement or modeling changes."}, {"concept": "Measured Patterns", "question": "Calibration matters because poor calibration can introduce…", "options": ["Systematic measurement error", "New class labels", "More storage capacity", "A decision boundary automatically"], "answer": 0, "explanation": "Systematic sensor error can limit the accuracy of every downstream stage."}, {"concept": "Classes", "question": "Class imbalance can bias a classifier toward…", "options": ["The majority class", "The minority class only", "No class", "Every class equally"], "answer": 0, "explanation": "With far more examples in one class, a classifier may favor that majority class."}, {"concept": "Pattern Recognition", "question": "A cluster differs from a class because a cluster is…", "options": ["Discovered without predefined labels", "Always manually labeled", "A sensor signal", "A decision boundary"], "answer": 0, "explanation": "Classes are predefined labels; clusters are groups discovered without labels in unsupervised learning."}, {"concept": "Biometrics", "question": "Which is a behavioral biometric?", "options": ["Typing rhythm", "Fingerprint ridge pattern", "Iris pattern", "DNA"], "answer": 0, "explanation": "Typing rhythm is behavioral; fingerprints, iris and DNA are physiological examples."}, {"concept": "Biometrics", "question": "A good biometric trait should generally be…", "options": ["Universal, unique, permanent and collectable", "Secret, temporary and random", "Only cheap", "Only visible"], "answer": 0, "explanation": "The lecture highlights universality, uniqueness, permanence and collectability as desirable properties."}, {"concept": "Pattern Recognition", "question": "Classification differs from regression because classification outputs…", "options": ["A discrete class label", "A continuous numeric value", "Only an image", "Only raw measurements"], "answer": 0, "explanation": "Classification produces discrete labels, whereas regression predicts continuous numeric values."}, {"concept": "Steps of Classification", "question": "The purpose of evaluation is to…", "options": ["Measure classifier performance and guide refinement", "Collect the first sensor reading", "Create a class from nothing", "Replace feature extraction"], "answer": 0, "explanation": "Evaluation measures performance, for example with a confusion matrix, and helps guide improvement."}, {"concept": "Pattern Recognition", "question": "Over <script>
(function(){
  const slides = JSON.parse(document.getElementById('slides-data').textContent);
  const navItems = JSON.parse(document.getElementById('nav-data').textContent);
  let i = 0;

  const jumpstrip = document.getElementById('jumpstrip');
  const slidewrap = document.getElementById('slidewrap');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const progressLabel = document.getElementById('progressLabel');
  const dots = document.getElementById('dots');
  const progressRing = document.getElementById('progressRing');
  const progressPercent = document.getElementById('progressPercent');
  const circumference = 2 * Math.PI * 29;

  navItems.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'jumppill';
    b.textContent = n.num + ' ' + n.title;
    b.dataset.first = n.firstSlide;
    b.addEventListener('click', () => go(n.firstSlide));
    jumpstrip.appendChild(b);
  });

  function currentConceptIndex(){
    return slides[i].cindex;
  }

  function fitSlide(){
    const content = slidewrap.querySelector('.slidecontent');
    if (!content) return;

    content.style.transform = 'scale(1)';
    const availableW = Math.max(0, slidewrap.clientWidth - 2);
    const availableH = Math.max(0, slidewrap.clientHeight - 2);
    const contentW = content.scrollWidth;
    const contentH = content.scrollHeight;

    if (!contentW || !contentH) return;

    const scale = Math.min(1, availableW / contentW, availableH / contentH);
    content.style.transform = 'scale(' + scale.toFixed(4) + ')';
  }

  function render(){
    const s = slides[i];
    slidewrap.scrollTop = 0;
    slidewrap.innerHTML =
      '<div class="slidecontent">' +
      '<div class="slide-eyebrow"><span class="cnum">' + s.cnum + '</span><span class="ctitle">' + s.ctitle + '</span></div>' +
      '<h2 class="slide-btitle">' + s.btitle + '</h2>' +
      (s.bindex === 0 && s.cbuilds ? '<p class="slide-builds">' + s.cbuilds + '</p>' : '') +
      '<div class="slide-body">' + s.html + '</div>' +
      '</div>';

    fitSlide();

    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === slides.length - 1;
    progressLabel.textContent = s.ctitle + '  \u00b7  ' + (s.bindex + 1) + ' / ' + s.bcount;
    const covered = Math.round(((i + 1) / slides.length) * 100);
    progressRing.style.strokeDasharray = circumference.toFixed(3);
    progressRing.style.strokeDashoffset = (circumference * (1 - covered / 100)).toFixed(3);
    progressPercent.textContent = covered + '%';

    [...jumpstrip.children].forEach((el, idx) => el.classList.toggle('active', idx === currentConceptIndex()));

    dots.innerHTML = '';
    for (let d = 0; d < s.bcount; d++){
      const dot = document.createElement('span');
      if (d === s.bindex) dot.classList.add('on');
      dots.appendChild(dot);
    }

    if (s.cid === 'test') initTest();
  }

  function go(n){
    i = Math.max(0, Math.min(slides.length - 1, n));
    render();
  }

  prevBtn.addEventListener('click', () => go(i - 1));
  nextBtn.addEventListener('click', () => go(i + 1));
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(i + 1);
    if (e.key === 'ArrowLeft') go(i - 1);
  });
  window.addEventListener('resize', fitSlide);

  let testInitDone = false;
  function initTest(){
    if (testInitDone) return;
    testInitDone = true;
    const root = document.getElementById('foundationQuiz');
    const scoreBox = document.getElementById('foundationScore');
    const qs = window.__FOUNDATION_QUESTIONS__ || [];
    if (!root || !qs.length) return;
    const state = {};
    function renderTest(){
      root.innerHTML = '';
      qs.forEach((q, qi) => {
        const card = document.createElement('article'); card.className = 'testgroup';
        const h = document.createElement('h4'); h.textContent = 'Question ' + String(qi + 1).padStart(2, '0') + ' \u00b7 ' + q.concept; card.appendChild(h);
        const p = document.createElement('p'); p.innerHTML = '<b>' + q.question + '</b>'; card.appendChild(p);
        q.options.forEach((opt, j) => {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'test-option';
          b.innerHTML = '<b>' + String.fromCharCode(65 + j) + '</b> ' + opt;
          if (state[qi] !== undefined){
            if (j === q.answer) b.classList.add('correct');
            if (j === state[qi] && j !== q.answer) b.classList.add('wrong');
            b.disabled = true;
          }
          b.onclick = () => { state[qi] = j; renderTest(); };
          card.appendChild(b);
        });
        if (state[qi] !== undefined){
          const f = document.createElement('div'); f.className = 'test-feedback ' + (state[qi] === q.answer ? 'good' : 'bad');
          f.innerHTML = '<b>' + (state[qi] === q.answer ? '\u2713 Correct' : '\u2717 Incorrect \u2014 correct answer highlighted in green') + '</b><br>' + q.explanation;
          card.appendChild(f);
        }
        root.appendChild(card);
      });
      const n = Object.keys(state).length, sc = Object.keys(state).filter(k => state[k] === qs[k].answer).length;
      if (n === qs.length){
        scoreBox.style.display = 'block';
        scoreBox.innerHTML = '<b>FINAL SCORE</b><div style="font-size:1.8rem;font-weight:700;margin:.3rem 0">' + sc + '/' + qs.length + '</div>' +
          (sc >= 27 ? 'Excellent work.' : sc >= 21 ? 'Good work \u2014 review the questions you missed.' : 'Keep practising and revisit the relevant Week 1 sections.') +
          ' <button type="button" class="reset-test" onclick="location.reload()">Reset test &rarr;</button>';
      } else scoreBox.style.display = 'none';
    }
    renderTest();
  }

  const hashId = location.hash.replace('#', '');
  const hashNav = navItems.find(n => n.id === hashId);
  if (hashNav) i = hashNav.firstSlide;

  render();
})();
</script>
